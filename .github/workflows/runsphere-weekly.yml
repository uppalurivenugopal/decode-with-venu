# Refreshes the RunSphere race calendar every Monday. A changed events.json is
# committed to main, which Vercel deploys automatically.
name: RunSphere weekly refresh

on:
  schedule:
    - cron: "30 1 * * 1" # Mondays 01:30 UTC = 07:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: runsphere-refresh
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl race listings
        run: python3 scripts/runsphere/crawl.py

      - name: Commit updated calendar
        run: |
          if git diff --quiet -- public/data/runsphere/events.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "runsphere-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/runsphere/events.json
          git commit -m "RunSphere: weekly calendar refresh $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
